{% load static %}
<!DOCTYPE html>
<html lang="en">
 
<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>SB Admin 2 - Blank</title>

    <!-- Custom fonts for this template-->
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">

</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
       {% include 'inc/sidebar.html' %}
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
            {% include 'inc/top.html' %}
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <h1 class="h3 mb-4 text-gray-800">Edit Product</h1>


        

                    <form method="post" action="/updproduct/" enctype="multipart/form-data">
                        {% csrf_token %}

                        <input type="hidden" name="productid" value="{{ myproduct.0 }}">

                         <div class="form-group">
                            <label for="category">Category</label>
                            <select class="form-control" id="category" name="category">

                                <option value="">-Select Category-</option>
                                {% for cat in mycats %}
   <option {% if cat.0 == myproduct.3 %} selected {% endif %}  value="{{ cat.0 }}">{{ cat.1 }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="productname">Product Name</label>
                            <input value="{{ myproduct.1 }}" type="text" class="form-control" id="productname" name="productname" placeholder="Enter product name">
                        </div>
                        <div class="form-group">
                            <label for="productprice">Product Price</label>
                            <input value="{{ myproduct.2 }}" type="text" class="form-control" id="productprice" name="productprice" placeholder="Enter product price">
                        </div>
                          <div class="form-group">
                            <label for="productimage">Product Image</label>
                            <input type="file" class="form-control" id="productimage" name="productimage">

                           <p><img src="/static/product_img/{{ myproduct.4 }}" width="100" height="100"></p>
                        </div>
                       

                           <div class="form-group">
                            <label for="productdetails">Product Details</label>
                            <textarea class="form-control" id="productdetails" name="productdetails" rows="3">{{ myproduct.5 }}</textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Edit Product</button>
                    </form>

                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
        {% include 'inc/footer.html' %}
            <!-- End of Footer -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal-->
   

    <!-- Bootstrap core JavaScript-->
    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

    <!-- Core plugin JavaScript-->
    <script src="{% static 'vendor/jquery-easing/jquery.easing.min.js' %}"></script>

    <!-- Custom scripts for all pages-->
    <script src="{% static 'js/sb-admin-2.min.js' %}"></script>

</body>

</html>
