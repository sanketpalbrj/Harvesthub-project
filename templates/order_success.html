<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - HarvestHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="/static/frontend/assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow border-0 p-5">
                    <div class="mb-3">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 4.5rem;"></i>
                    </div>
                    <h2 class="fw-bold mb-2">Order Placed Successfully!</h2>
                    <p class="text-muted mb-4">Thank you for shopping with <strong>HarvestHub</strong>. Your agricultural supplies are being prepared for dispatch.</p>
                    
                    <div class="alert alert-success d-inline-block mx-auto px-4 py-2 fw-bold mb-4">
                        Order ID: #HH-{{ order_id }}
                    </div>

                    <div class="d-flex justify-content-center gap-3">
                        <a href="/#marketplace" class="btn btn-success px-4 fw-semibold">
                            <i class="bi bi-shop me-1"></i> Continue Shopping
                        </a>
                        <a href="/myorders/" class="btn btn-outline-dark px-4">
                            View My Orders
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
